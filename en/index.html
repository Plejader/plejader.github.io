<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plejader Games</title>
<link rel="stylesheet" href="/lang.css">
<link rel="alternate" hreflang="pl" href="https://plejader.github.io/">
<link rel="alternate" hreflang="en" href="https://plejader.github.io/en/">
<link rel="icon" href="/my-chinchilla/icon.png">
<style>
  body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 32px 20px; line-height: 1.5; color: #222; }
  header { text-align: center; margin-bottom: 32px; }
  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
  .app { display: block; padding: 20px; border: 1px solid #ddd; border-radius: 12px; text-decoration: none; color: inherit; text-align: center; }
  .app:hover { box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  .app img { width: 96px; height: 96px; border-radius: 20px; }
  .app h2 { margin: 12px 0 4px; font-size: 20px; }
  .app p { margin: 0; color: #555; font-size: 15px; }
  footer { margin-top: 48px; text-align: center; font-size: 14px; color: #666; }
  footer a { color: #666; }
</style>
</head>
<body>
<nav class="lang"><a href="/" hreflang="pl">PL</a><span>EN</span></nav>
  <header>
    <h1>Plejader Games</h1>
    <p>Mobile games and apps made by Jan Nalepka.</p>
  </header>

  <main class="apps">
    <!-- New game: copy en/my-chinchilla under a new name, change its content and add another tile here (and in the Polish /index.html). -->
    <a class="app" href="/en/my-chinchilla/">
      <img src="/my-chinchilla/icon.png" alt="">
      <h2>My Chinchilla</h2>
      <p>Take care of a virtual chinchilla. Android.</p>
    </a>
  </main>

  <footer>
    <p>Jan Nalepka (Plejader Games) · <a href="mailto:plejadergames@gmail.com">plejadergames@gmail.com</a></p>
  </footer>
</body>
</html>
